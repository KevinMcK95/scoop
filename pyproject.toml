[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoop-sky"
version = "0.1.0"
description = "Provenance-bearing astronomical inventories and tool-driven chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
literature = ["httpx>=0.28,<1"]
chat = [
    "langgraph>=1.2.16,<2",
    "langchain-core>=1.6.12,<2",
]
# The exoplanet data source runs Xuan Ji's exoplanets/archive.py (plain requests).
exoplanets = ["requests>=2.32,<3"]
# The monthly dataset scout: ADS over httpx, the agentbook loop (jsonschema), and
# a model client. Data sources it generates query TAP with pyvo.
scout = [
    "scoop-sky[literature]",
    "jsonschema>=4.21,<5",
    "anthropic>=0.49,<1",
    "pyvo>=1.5,<2",
]
# The data agent (scoop/discovery.py): VO registry, TAP, VizieR, MOC server.
discovery = [
    "pyvo>=1.9,<2",
    "astroquery>=0.4.11",
    "astropy>=7",
    "requests>=2.32,<3",
]
# Stellar-stream tracks for region searches along streams (scoop/streams.py reads its files).
streams = ["galstreams>=1.2.1,<2"]
server = [
    "scoop-sky[chat,literature,discovery,streams]",
    "starlette>=0.46,<2",
    "uvicorn>=0.34,<1",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[tool.setuptools.packages.find]
include = ["scoop", "scoop.*"]
