<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="SCOOP">
  <title>SCOOP</title>
  <defs>
    <clipPath id="s-coneclip">
      <path d="M32 59 L18.60 26.54 A14.5 14.5 0 0 0 45.40 26.54 Z"/>
    </clipPath>
  </defs>

  <!-- the cone: a cone-search wedge, apex at the observer -->
  <path d="M32 59 L18.60 26.54 A14.5 14.5 0 0 0 45.40 26.54 Z" fill="#57c3bb"/>
  <g clip-path="url(#s-coneclip)" stroke="#0b1623" stroke-opacity="0.42" stroke-width="1.4">
    <path d="M-16 -5H80M-16 0H80M-16 5H80M-16 10H80M-16 15H80M-16 20H80M-16 25H80M-16 30H80M-16 35H80M-16 40H80M-16 45H80M-16 50H80M-16 55H80M-16 60H80M-16 65H80"
          transform="rotate(32 32 42)"/>
    <path d="M-16 -5H80M-16 0H80M-16 5H80M-16 10H80M-16 15H80M-16 20H80M-16 25H80M-16 30H80M-16 35H80M-16 40H80M-16 45H80M-16 50H80M-16 55H80M-16 60H80M-16 65H80"
          transform="rotate(-32 32 42)"/>
  </g>

  <!-- the scoop: one patch of sky -->
  <circle cx="32" cy="21" r="14.5" fill="#0e1a28" stroke="#79d9cb" stroke-width="2.6"/>

  <!-- everything in it -->
  <g fill="#79d9cb">
    <path d="M31 12.2 C32.3 16.6 33.4 17.7 37.8 19 C33.4 20.3 32.3 21.4 31 25.8
             C29.7 21.4 28.6 20.3 24.2 19 C28.6 17.7 29.7 16.6 31 12.2 Z"/>
    <circle cx="39" cy="26" r="1.5"/>
    <circle cx="22.5" cy="26.5" r="1.1"/>
    <circle cx="38.5" cy="12.5" r="1.1"/>
    <circle cx="22" cy="14.5" r="0.9"/>
    <circle cx="32" cy="29.5" r="0.9"/>
  </g>

  <!-- the observer -->
  <circle cx="32" cy="59" r="2.2" fill="#79d9cb"/>
</svg>
